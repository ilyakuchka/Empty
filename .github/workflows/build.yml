name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build signed release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -n 5

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p dist
          cp "$APK" dist/Empty-1.1.2-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Empty-1.1.2-test
          path: dist/Empty-1.1.2-test.apk
          if-no-files-found: error
