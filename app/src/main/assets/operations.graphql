  forgeCards(input: $input) {
    userId
    newCards {
      quantity
      modifier
      shard
      card {
        ...CardCommon
      }
    }
    addUserCards {
      userId
      cardId
      quantity
      modifier
      shard
      locked
      card {
        ...CardCommon
      }
    }
    updateUserCards {
      userId
      cardId
      quantity
      modifier
      shard
      locked
    }
    removeUserCards {
      cardId
      modifier
      quantity
      shard
    }
  }
}

