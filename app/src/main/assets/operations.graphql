fragment AnimeSubmissionChangeCommon on AnimeSubmissionChangeUnion {
  ... on AnimeSubmissionMalIdChange {
    malIdOldValue: oldValue
    malIdNewValue: newValue
  }
  ... on AnimeSubmissionImdbIdChange {
    imdbIdOldValue: oldValue
    imdbIdNewValue: newValue
  }
  ... on AnimeSubmissionOriginalNameChange {
    originalOldValue: oldValue {
      lang
      content
    }
    originalNewValue: newValue {
      lang
      content
    }
  }
  ... on AnimeSubmissionTypeChange {
    typeOldValue: oldValue
    typeNewValue: newValue
  }
  ... on AnimeSubmissionStatusChange {
    statusOldValue: oldValue
    statusNewValue: newValue
  }
  ... on AnimeSubmissionFormatVecChange {
    formatsOldValue: oldValue
    addFormats: addItems
    removeFormats: removeItems
  }
  ... on AnimeSubmissionBlockedInCountryVecChange {
    blockedInCountriesOldValue: oldValue
    addBlockedInCountries: addItems
    removeBlockedInCountries: removeItems
  }
  ... on AnimeSubmissionSourceChange {
    sourceOldValue: oldValue
    sourceNewValue: newValue
  }
  ... on AnimeSubmissionTranslitionStatusChange {
    translitionStatusOldValue: oldValue
    translitionStatusNewValue: newValue
  }
  ... on AnimeSubmissionOriginCountryChange {
    originCountryOldValue: oldValue
    originCountryNewValue: newValue
  }
  ... on AnimeSubmissionReleasedOnChange {
    releasedOnOldValue: oldValue
    releasedOnNewValue: newValue
  }
  ... on AnimeSubmissionCompletedOnChange {
    completedOnOldValue: oldValue
    completedOnNewValue: newValue
  }
  ... on AnimeSubmissionRatingChange {
    ratingOldValue: oldValue
    ratingNewValue: newValue
  }
  ... on AnimeSubmissionTitlesChange {
    titlesOldValue: oldValue {
      lang
      content
    }
    addTitleItems: addItems {
      lang
      content
    }
    removeTitleItems: removeItems {
      lang
      content
    }
  }
  ... on AnimeSubmissionAlternativeNamesChange {
    alternativeNamesOldValue: oldValue {
      lang
      content
    }
    addAlternativeNamesValue: addItems {
      lang
      content
    }
    removeAlternativeNamesValue: removeItems {
      lang
      content
    }
  }
  ... on AnimeSubmissionLinkVecChange {
    linksOldValue: oldValue {
      type
      service
      url
    }
    addLinksValue: addItems {
      type
      service
      url
    }
    removeLinksValue: removeItems {
      type
      service
      url
    }
  }
  ... on AnimeSubmissionDescriptionsChange {
    updateDescriptionItems: updateItems {
      lang
      oldContent {
        ...TiptapRootCommon
      }
      content {
        ...TiptapRootCommon
      }
    }
  }
  ... on AnimeSubmissionCoverChange {
    coverOldValue: oldValue {
      ...AnimeCoverCommon
    }
    coverNewValue: newValue {
      ...AnimeCoverCommon
    }
  }
  ... on AnimeSubmissionBannerChange {
    bannerOldValue: oldValue {
      ...AnimeBannerCommon
    }
    bannerNewValue: newValue {
      ...AnimeBannerCommon
    }
  }
  ... on AnimeSubmissionLabelsChange {
    labelOldValue: oldValue {
      ...LabelCommon
    }
    addLabelIds: addItems {
      ...LabelCommon
    }
    removeLabelIds: removeItems {
      ...LabelCommon
    }
  }
  ... on AnimeSubmissionSeriesChange {
    seriesOldValue: oldValue {
      ...SeriesCommon
    }
    addSeriesIds: addItems {
      ...SeriesCommon
    }
    removeSeriesIds: removeItems {
      ...SeriesCommon
    }
  }
  ... on AnimeSubmissionCharactersChange {
    updateCharacterItems: updateItems {
      role
      character {
        ...CharacterCommon
      }
    }
    removeCharacterItems: removeItems {
      role
      character {
        ...CharacterCommon
      }
    }
  }
  ... on AnimeSubmissionStaffChange {
    staffUpdateItems: updateItems {
      roles
      person {
        ...PersonCommon
      }
    }
    staffRemoveItems: removeItems {
      roles
      person {
        ...PersonCommon
      }
    }
  }
  ... on AnimeSubmissionStudioChange {
    studioAddItems: addItems {
      ...StudioCommon
    }
    studioRemoveItems: removeItems {
      ...StudioCommon
    }
    studioOldValue: oldValue {
      ...StudioCommon
    }
  }
  ... on AnimeSubmissionLicenseeChange {
    licenseeAddItems: addItems {
      ...StudioCommon
    }
    licenseeRemoveItems: removeItems {
      ...StudioCommon
    }
    licenseeOldValue: oldValue {
      ...StudioCommon
    }
  }
  ... on AnimeSubmissionRelationsChange {
    updateRelationItems: updateItems {
      relation
      entity {
        id
        ... on Anime {
          id
          slug
          originalName {
            lang
            content
          }
          titles {
            lang
            content
          }
          animeStatus: status
          animeType: type
          animeFormats: formats
          animeRating: rating
          containExplicitThemes
          cover {
            ...AnimeCoverCommon
          }
        }
        ... on Manga {
          id
          slug
          originalName {
            lang
            content
          }
          titles {
            lang
            content
          }
          mangaStatus: status
          mangaType: type
          mangaFormats: formats
          mangaRating: rating
          containExplicitThemes
          cover {
            ...MangaCoverCommon
          }
        }
        __typename
      }
    }
    removeRelationItems: removeItems {
      relation
      entity {
        id
        ... on Anime {
          id
          slug
          originalName {
            lang
            content
          }
          titles {
            lang
            content
          }
          animeStatus: status
          animeType: type
