# query fetchMainPage  [index-Bu-3nVkm.js]
query fetchMainPage($skipLabelsSpotlight: Boolean!, $skipManga: Boolean!, $skipAnime: Boolean!, $skipPosts: Boolean!) {
  ad(page: "main") {
    id
    link
    media {
      ... on AdMediaImage {
        blurhash
        url
      }
      ... on AdMediaVideo {
        url
      }
      __typename
    }
  }
  experimentalSpotlightLabels @skip(if: $skipLabelsSpotlight) {
    id
    label {
      ...LabelCommon
    }
    previewMangas {
      ...MangaCardCommon
    }
  }
  lastEpisodeTranslations: animeEpisodeTranslations(first: 5, orderBy: {field: CREATED_AT, direction: DESC}) @skip(if: $skipAnime) {
    edges {
      node {
        id
        type
        createdAt
        anime {
          ...AnimeCardCommon
        }
        episode {
          id
          number
        }
        teams {
          ...TeamCommon
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  mangaBookmarkNextChapters @skip(if: $skipManga) {
    id
    slug
    number
    volume
    name
    createdAt
    manga {
      ...MangaCardCommon
      translitionStatus
      chapters
      isLicensed
      viewerInBlockedCountry
    }
  }
  lastMangaChapters: mangas(first: 21, orderBy: {field: LAST_CHAPTER_AT, direction: DESC}, chapters: {start: 1}) @skip(if: $skipManga) {
    edges {
      node {
        ...MangaCardCommon
        translitionStatus
        lastChapters {
          id
          slug
          number
          volume
          name
          createdAt
        }
        isLicensed
        viewerInBlockedCountry
      }
    }
  }
  lastPosts: posts(first: 6, status: PUBLISHED, orderBy: {field: CREATED_AT, direction: DESC}) @skip(if: $skipPosts) {
    edges {
      node {
        ...PostCommon
        previewContent {
          ...TiptapRootCommon
        }
      }
    }
  }
}

