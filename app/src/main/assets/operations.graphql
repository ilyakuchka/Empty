      content
    }
    animeStatus: status
    animeType: type
    animeFormats: formats
    animeRating: rating
    cover {
      ...AnimeCoverCommon
    }
  }
  ... on Manga {
    id
    slug
    originalName {
      lang
      content
    }
    titles {
      lang
      content
    }
    mangaStatus: status
    mangaType: type
    mangaFormats: formats
    mangaRating: rating
    cover {
      ...MangaCoverCommon
    }
  }
  ... on Character {
    ...CharacterCommon
  }
  __typename
