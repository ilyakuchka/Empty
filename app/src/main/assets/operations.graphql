# query search  [index-Bu-3nVkm.js]
query search($query: String!, $type: SearchType!) {
  search(query: $query, type: $type, first: 10) {
    edges {
      node {
        ... on SearchUser {
          id
          slug
          name
          bot
          verified
          avatar {
            ...UserAvatarCommon
          }
          frame {
            ...UserFrameCommon
          }
          status {
            ...UserStatusCommon
          }
        }
        ... on SearchTeam {
          id
          slug
          name
          verified
          activity
          avatar {
            ...TeamAvatarCommon
          }
        }
        ... on SearchGuild {
          id
          slug
          name
          level
          avatar {
            ...TeamAvatarCommon
          }
        }
        ... on SearchAnime {
          id
          slug
          originalName
          titles {
            lang
            content
          }
          animeType: type
          animeRating: rating
          animeStatus: status
          translitionStatus
          score
          cover {
            ...AnimeCoverCommon
          }
        }
        ... on SearchManga {
          id
          slug
          originalName
          titles {
            lang
            content
          }
          mangaType: type
          mangaStatus: status
          mangaRating: rating
          translitionStatus
          score
          cover {
            ...MangaCoverCommon
          }
        }
        ... on SearchStudio {
          id
          slug
          name
          titles {
            lang
            content
          }
          logotype {
            ...StudioLogotypeCommon
          }
        }
        ... on SearchPerson {
          id
          slug
          name
          titles {
            lang
            content
          }
          cover {
            ...PersonCoverCommon
          }
        }
        ... on SearchCharacter {
          id
          slug
          name
          titles {
            lang
            content
          }
          cover {
            ...CharacterCoverCommon
          }
        }
        __typename
      }
    }
  }
}

