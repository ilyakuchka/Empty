# query fetchNewComments  [comment-NQxbbvxz.js]
query fetchNewComments($first: Int = 100, $after: String, $authorId: ID, $skipTotalCount: Boolean!) {
  newComments(first: $first, after: $after, authorId: $authorId) {
    totalCount @skip(if: $skipTotalCount)
    edges {
      node {
        ...CommentCommon
        commentable {
          id
          ...CommentCommentableCommon
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

